<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>純太郎 4年1学期の通知表 | 学びノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#ffffff;--ink:#2B2A28;--text-dim:#57544F;--border:rgba(43,42,40,0.12);
    --radius:14px;--shadow-sm:0 2px 14px rgba(43,42,40,0.06);--focus:2px solid #9FB3C8;
  }
  body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;padding:32px 20px 80px}
  .wrap{max-width:760px;margin:0 auto}
  .back{display:inline-flex;align-items:center;min-height:44px;font-size:0.85rem;color:var(--text-dim);text-decoration:none;margin-bottom:16px}
  .back:hover{color:var(--ink)}
  .back:focus-visible{outline:var(--focus);outline-offset:2px}
  h1{font-size:1.3rem;margin-bottom:6px}
  .sub{font-size:0.85rem;color:var(--text-dim);margin-bottom:28px}
  .page{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:24px}
  .page img{display:block;width:100%;height:auto}
  #gate{position:fixed;inset:0;z-index:500;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:24px;text-align:center}
  #gate h1{font-size:1.4rem}
  #gate p{color:var(--text-dim);font-size:0.9rem;max-width:360px}
  #gate form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #gate input{font-size:1rem;padding:13px 16px;border-radius:30px;border:1px solid var(--border);background:#fff;width:220px;min-height:44px}
  #gate button{font-size:0.9rem;padding:13px 24px;min-height:44px;border-radius:30px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
  #gate .err{color:#B3261E;font-size:0.82rem;min-height:1.2em}
  #main{display:none}
</style>
</head>
<body>
<div id="gate">
  <h1>学びノート</h1>
  <p>家族だけのページです。合言葉を入力してください。</p>
  <form id="gate-form" autocomplete="off">
    <input type="password" id="gate-pass" placeholder="合言葉" autofocus>
    <button type="submit">開く</button>
  </form>
  <div class="err" id="gate-err"></div>
</div>

<main id="main">
<div class="wrap">
  <a class="back" href="../juntaro/index.html">← 学びノートに戻る</a>
  <h1>純太郎 4年1学期の通知表</h1>
  <div class="sub">1学期の通知表スキャン画像（所見は3学期に記載予定）。</div>
  <div class="page"><img src="juntaro/juntaro_grade4-term1-1.jpg" alt="純太郎4年1学期通知表" loading="lazy"></div>
</div>
</main>

<script>
(function(){
  var PASS = "kotaro0918juntaro0805";
  var gate = document.getElementById('gate');
  var main = document.getElementById('main');
  var form = document.getElementById('gate-form');
  var input = document.getElementById('gate-pass');
  var err = document.getElementById('gate-err');

  if(sessionStorage.getItem('manabi-note-auth') === '1'){
    gate.style.display = 'none';
    main.style.display = 'block';
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(input.value === PASS){
      sessionStorage.setItem('manabi-note-auth', '1');
      gate.style.display = 'none';
      main.style.display = 'block';
    } else {
      err.textContent = '合言葉が違います。';
      input.value = '';
      input.focus();
    }
  });
})();
</script>
</body>
</html>
