<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>成績管理・成長管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F2F4F9;--ink:#1D2129;--text-dim:#4E5969;
    --sage:#1F9955;--sage-deep:#12793A;--dust-blue:#3D74E6;--dust-blue-deep:#2A4FBF;
    --border:rgba(29,33,41,0.12);--radius:14px;
    --shadow-sm:0 2px 14px rgba(29,33,41,0.08);--shadow-md:0 10px 30px rgba(29,33,41,0.12);
    --focus:2px solid var(--dust-blue-deep);
  }
  body{
    font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  a{color:inherit}
  .wrap{max-width:600px;width:100%;text-align:center}
  h1{font-size:1.5rem;margin-bottom:32px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:520px){.cards{grid-template-columns:1fr}}
  .card{
    display:block;background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    padding:32px 20px;box-shadow:var(--shadow-sm);text-decoration:none;color:inherit;
    transition:box-shadow .15s ease,transform .15s ease;
  }
  .card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .card:focus-visible{outline:var(--focus);outline-offset:2px}
  .card .name{font-size:1.15rem;font-weight:700;margin-bottom:6px}
  .card .hint{font-size:0.8rem;color:var(--text-dim)}
  footer{margin-top:32px;font-size:0.78rem;color:var(--text-dim)}

  #gate{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:24px;text-align:center}
  #gate h1{font-size:1.4rem;margin-bottom:0}
  #gate p{color:var(--text-dim);font-size:0.9rem;max-width:360px}
  #gate form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #gate input{font-size:1rem;padding:13px 16px;border-radius:30px;border:1px solid var(--border);background:#fff;width:220px;min-height:44px}
  #gate button{font-size:0.9rem;padding:13px 24px;min-height:44px;border-radius:30px;border:1px solid var(--dust-blue-deep);background:var(--dust-blue-deep);color:#fff;cursor:pointer}
  #gate .err{color:#B3261E;font-size:0.82rem;min-height:1.2em}
  #main{display:none}
</style>
</head>
<body>

<div id="gate">
  <h1>成績管理・成長管理</h1>
  <p>家族だけのページです。合言葉を入力してください。</p>
  <form id="gate-form" autocomplete="off">
    <input type="password" id="gate-pass" placeholder="合言葉" autofocus>
    <button type="submit">開く</button>
  </form>
  <div class="err" id="gate-err"></div>
</div>

<main id="main">
  <div class="wrap">
    <h1>成績管理・成長管理</h1>
    <div class="cards">
      <a class="card" href="kotaro/index.html">
        <div class="name">孝太郎</div>
        <div class="hint">6年生</div>
      </a>
      <a class="card" href="juntaro/index.html">
        <div class="name">純太郎</div>
        <div class="hint">4年生</div>
      </a>
    </div>
    <footer>このページは家族だけが見られるようにしています。それぞれのページに合言葉を入力すると開きます。</footer>
  </div>
</main>

<script>
(function(){
  var PASS = "kotaro0918juntaro0805";
  var gate = document.getElementById('gate');
  var main = document.getElementById('main');
  var form = document.getElementById('gate-form');
  var input = document.getElementById('gate-pass');
  var err = document.getElementById('gate-err');

  if(sessionStorage.getItem('manabi-note-auth') === '1'){
    gate.style.display = 'none';
    main.style.display = 'block';
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(input.value === PASS){
      sessionStorage.setItem('manabi-note-auth', '1');
      gate.style.display = 'none';
      main.style.display = 'block';
    } else {
      err.textContent = '合言葉が違います。';
      input.value = '';
      input.focus();
    }
  });
})();
</script>
</body>
</html>
