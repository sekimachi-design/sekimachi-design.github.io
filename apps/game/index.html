<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>純太郎くんが作ったゲーム — Sekimachi Design Studio</title>
  <link rel="icon" type="image/x-icon" href="../../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', 'Hiragino Sans', sans-serif; background: #fafafa; color: #111; padding: 32px 16px 48px; }
    main { max-width: 480px; margin: 0 auto; }
    .back { display: inline-block; font-size: 13px; color: #888; text-decoration: none; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .lead { font-size: 13px; color: #888; margin-bottom: 20px; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 10px 12px; text-decoration: none; color: inherit; }
    .row:hover { border-color: #c8e020; }
    .ic { font-size: 22px; width: 32px; text-align: center; flex: none; }
    .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .tx b { font-size: 15px; font-weight: 700; }
    .tx small { font-size: 12px; color: #888; }
    .btn { flex: none; font-size: 13px; font-weight: 700; background: #c8e020; color: #111; border-radius: 999px; padding: 6px 14px; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../index.html">← Apps</a>
    <h1>純太郎くんが作ったゲーム</h1>
    <p class="lead">タップして あそぼう</p>
    <div class="list">
    <a class="row" href="../sailor-quest/">
      <span class="ic">⚓</span>
      <span class="tx"><b>セーラークエスト3D</b><small>3Dオープンワールドの冒険</small></span>
      <span class="btn">あそぶ</span>
    </a>
    <a class="row" href="../yami/">
      <span class="ic">👻</span>
      <span class="tx"><b>ヤミのおにごっこ 3D</b><small>キラーからにげる3Dおにごっこ</small></span>
      <span class="btn">あそぶ</span>
    </a>
    <a class="row" href="../egg-thief/">
      <span class="ic">🥚</span>
      <span class="tx"><b>たまごドロボウ3D</b><small>たまごをぬすんで、そだてて、つよくなる</small></span>
      <span class="btn">あそぶ</span>
    </a>
    <a class="row" href="../cyber-arena/">
      <span class="ic">🤖</span>
      <span class="tx"><b>サイバー・アリーナ 3D</b><small>3Dの大群戦アクション</small></span>
      <span class="btn">あそぶ</span>
    </a>
    </div>
  </main>
</body>
</html>
