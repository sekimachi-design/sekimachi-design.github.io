  #start { background:radial-gradient(ellipse at 50% 28%, rgba(70,40,160,.92), rgba(6,6,28,.97) 70%); }
  #start::before { content:""; position:absolute; inset:0; background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#9ae8ff,transparent),radial-gradient(2px 2px at 160px 20px,#ffd54a,transparent); background-size:200px 120px; opacity:.55; animation:drift 40s linear infinite; }

</head>
<body>
<div id="vig"></div><div id="scope"><div class="sc-h"></div><div class="sc-v"></div><div class="sc-t">🎯 火星スナイパー　WASD=ねらいを動かす　クリック/0=発射　C/右クリック=スコープ</div></div><div id="chat"><div id="chat-log"></div><input id="chat-input" maxlength="80" placeholder="💬 ここをタップして入力（マウスが消えてたら Esc）" autocomplete="off"></div><div id="hurt"></div><div class="hud" id="zonebn"></div><div id="speedfx"></div>

<div id="start">
  <h1>🥚 たまごドロボウ3D</h1>
  <p>👉 ここをクリックしてスタート！</p>
  <p>⌨ <b>W A S D</b> で歩く　／　スペースでジャンプ　／　<b>E</b> でつかう</p>
  <p>👀 見まわす：<b>矢印キー</b> / <b>トラックパッドを2本指でスワイプ</b> / クリックのあとマウスを動かす（Escでやめる）</p><p>🔍 ズーム：トラックパッドをピンチ　📦 <b>O</b>：どこでも ふ化きをそうさ　🧬 <b>M</b>：へんい</p>
  <p style="font-size:17px;color:#ffe98a">💬 左下の チャットに ひみつのコードを 入れてみよう…？</p>
  <p style="font-size:16px;opacity:.8">※ キーボードは「英数」モード（Aのまま）にしてね</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================

const BASE_SPEED   = 9;     // さいしょの足の速さ

const FAST_MULT    = 1.6;   // ダッシュギツネ(はやい敵)の速さ = 番人 × これ

const SECRET_INCOME = 5e10; // ひみつの森に入るのに ひつような「びょうかん かせぎ」（50B/s）

const CAPTIONS = ["いでよ！","めっちゃカッコいい！","やばすぎ！","きたーーー！","手がいっぱいある！","つよそう！"];

const RARITY = ["コモン","レア","神聖な","エターナル","ミシック","セレスティアル","ゴッド"];
const RARITY_COLOR = ["#d8d8d8","#4aa8ff","#ffe14a","#ff6af0","#3affc0","#ffffff","#ff7aff"];
const TIERS = [
  { name:"ふつうのたまご",   color:0xffffff, hatch:8,  base:2000   },
  { name:"レアたまご",       color:0x4aa8ff, hatch:20, base:40000  },
  { name:"神聖なたまご",     color:0xd070ff, hatch:45, base:1500000  },
  { name:"エターナルたまご", color:0xffd700, hatch:90, base:50000000 },
  { name:"ミシックたまご",       color:0x3affc0, hatch:150, base:500000000 },
  { name:"セレスティアルたまご", color:0xcfe8ff, hatch:220, base:5000000000 },
  { name:"ゴッドたまご",         color:0xff5aff, hatch:300, base:50000000000 },
];
// トレイル：なまえ / ねだん / 速さ倍率 / いろ(rainbowは虹)
const TRAILS = [
  { name:"ブルー",         price:300,    mult:1.2, color:0x3a9bff },
  { name:"グリーン",       price:1200,   mult:1.4, color:0x3aff6a },
  { name:"ピンク",         price:3000,   mult:1.6, color:0xff7ac8 },
  { name:"オレンジ",       price:8000,   mult:1.9, color:0xff9a3a },
  { name:"パープル",       price:2e4,    mult:2.2, color:0xc03aff },
  { name:"ゴールド",       price:5e4,    mult:2.6, color:0xffd54a },
  { name:"ミント",         price:1.2e5,  mult:3.0, pal:[0x7affd0,0xffffff] },
  { name:"さくら",         price:3e5,    mult:3.5, pal:[0xffb0d0,0xffffff,0xff7ab0] },
  { name:"ほのお",         price:7e5,    mult:4.0, pal:[0xff3a1a,0xff9a1a,0xffe14a] },
  { name:"こおり",         price:1.5e6,  mult:4.6, pal:[0x9affff,0xffffff,0x4aa8ff] },
  { name:"いなずま",       price:3.5e6,  mult:5.3, pal:[0xfff27a,0xffffff] },
  { name:"うみ",           price:8e6,    mult:6.0, pal:[0x1a6aff,0x3affff,0x7ad0ff] },
  { name:"もり",           price:2e7,    mult:7.0, pal:[0x1aa83a,0x7aff4a,0xb0ff90] },
  { name:"さばく",         price:5e7,    mult:8.0, pal:[0xe8c878,0xffe8a0,0xc08a3a] },
  { name:"ネオン",         price:1.2e8,  mult:9.5, pal:[0x3affea,0xff3af0,0xfff23a] },
  { name:"ギャラクシー",   price:3e8,    mult:11,  pal:[0xb04aff,0xff6af0,0x4a6aff,0xffffff] },
  { name:"ダイヤモンド",   price:8e8,    mult:13,  pal:[0xffffff,0x9affff,0xd0f4ff] },
  { name:"レインボー",     price:2e9,    mult:15,  color:"rainbow" },
  { name:"ブラックホール", price:5e9,    mult:18,  pal:[0x2a0a4a,0x6a2aff,0x000000] },
  { name:"超神",           price:2e10,   mult:22,  color:"rainbow2" },
];
const trailColor = tr => {
  if (tr.color === "rainbow") return new THREE.Color().setHSL((performance.now()/600)%1,1,.55);
  if (tr.color === "rainbow2") return new THREE.Color().setHSL(Math.random(),1,.65);
  if (tr.pal) return new THREE.Color(tr.pal[Math.floor(Math.random()*tr.pal.length)]);
  return new THREE.Color(tr.color);
};
// そうび：スロットごとにLv1〜10
const GEAR_SLOTS = ["ヘルメット","よろい","ブーツ","マント"];
const GEAR_TIERS = [
  { name:"ブロンズ", col:0xb8783a, price:2e3 }, { name:"てつ", col:0xaab0bb, price:1e4 }, { name:"ぎん", col:0xe8eef8, price:5e4 },
  { name:"きん", col:0xffd54a, price:2.5e5 }, { name:"ルビー", col:0xe02a3a, price:1.2e6 }, { name:"エメラルド", col:0x2ac86a, price:6e6 },
  { name:"ダイヤ", col:0x9affff, price:3e7 }, { name:"ミスリル", col:0x7ad8ff, price:2e8 }, { name:"かみ", col:0xfff27a, price:2e9 }, { name:"超神", col:0xffffff, price:2e10 },
];
const gearSum = () => save.gear.reduce((a,b) => a+b, 0);
// へんい（ペットに つけると お金かせぎがふえる）
const MUT = [
  { name:"",           mult:1,   col:0xffffff, price:0 },
  { name:"ゴールド",   mult:2,   col:0xffd54a, price:5e4 },
  { name:"ダイヤ",     mult:4,   col:0x9affff, price:3e5 },
  { name:"レインボー", mult:8,   col:"rainbow", price:2e6 },
  { name:"ネオン",     mult:15,  col:0x3affb0, price:1.5e7 },
  { name:"ギャラクシー", mult:30, col:0xb04aff, price:1e8 },
  { name:"ブラックホール", mult:60, col:0x6a2aff, price:8e8 },
  { name:"エターナル", mult:150, col:0xff3af0, price:6e9 },
];
const petInc = p => p.income * MUT[p.mut || 0].mult;
const rollMut = () => { const r = Math.random(); return r < .90 ? 0 : r < .95 ? 1 : r < .975 ? 2 : r < .987 ? 3 : r < .994 ? 4 : r < .998 ? 5 : r < .9995 ? 6 : 7; };
// ============================================================

const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function fmt(n) {
  n = Math.floor(n); if (n >= 1e36) return n.toExponential(2).replace("+",""); const u = [[1e33,"Dc"],[1e30,"No"],[1e27,"Oc"],[1e24,"Sp"],[1e21,"Sx"],[1e18,"Qi"],[1e15,"Qa"],[1e12,"T"],[1e9,"B"],[1e6,"M"],[1e3,"K"]];
  for (const [v,s] of u) if (n >= v) return (n/v).toFixed(n/v < 10 ? 2 : 1).replace(/\.?0+$/,"") + s;
  return String(n);
}
const fmtF = n => n < 10 ? n.toFixed(1) : fmt(n);

// ---------- セーブ ----------
let save = { gear:[0,0,0,0], mutItems:[0,0,0,0,0,0,0,0], incV:0, trailV:0, gods:[false,false,false,false,false], ultimate:false, admin:false, incN:3, tp:false, shards:[], code:null, slots:1, treads:[true,false,false], dex:[], restockAt:0, stock:[0,0,0,0], money:0, train:0, owned:[], equip:-1, pets:[], hidden:false };
try { const s = JSON.parse(localStorage.getItem("eggthief3d_v2")); if (s) save = Object.assign(save, s); } catch(e) {}
function doSave() { try { localStorage.setItem("eggthief3d_v2", JSON.stringify(save)); } catch(e) {} }
setInterval(doSave, 4000);
const CFG_DEF = { base:BASE_SPEED, jump:11, guard:GUARD_SPEED, fast:FAST_MULT, income:1, hatch:1, carry:CARRY_SLOW, blink:22, gravity:30, trainMult:1, respawn:EGG_RESPAWN, fly:false, bestEgg:false, bestHatch:false, ghost:false, enemyScale:1, eggScale:1, petScale:1, priceMult:1, tsec:8, tcool:20, freeze:false, sound:true, godSpeed:42, weather:"clear", cam:13, fov:65, playerScale:1, stealRange:3, bonus:0, blinkCool:2, sight:1, light:1, trailSize:1, timeScale:1, infJump:false, autoSteal:false, autoHatch:false, noCatch:false, noEnemies:false };
const cfg = Object.assign({}, CFG_DEF, save.cfg || {}); save.cfg = cfg;
if (save.god) save.gods[0] = true;

  else if (nearLock >= 0) msg = `[E] ${TREADS[nearLock].name}をかう ($${fmt(priceR(TREADS[nearLock].price))})`;
  else if (!inRoom && nearPillar(p)) msg = save.admin ? "[E] コマンドパネル" : "[E] パスワードをいれる";
  else if (!inRoom && shards.some(sh => !save.shards.includes(sh.id) && dist2(p,sh.pos) < 5)) msg = "[E] かぎのかけらを とる！";
  else if (!inRoom && dist2(p,DOOR) < 10) msg = (save.hidden || !SECRET_HARD) ? "[E] ひみつの森に入る" : (income() >= SECRET_INCOME ? "[E] 🔓 ひみつの森に入る" : `🔒 かせぎ $${fmt(SECRET_INCOME)}/s いじょうで ひらく（いま $${fmtF(income())}/s）`);
  else if (inRoom && dist2(p,LAB) < 6) msg = "[E] ひみつのラボ（スピードなどをいじる）";
  else if (inRoom && dist2(p,TPPAD) < 6) msg = "[E] テレポートパッド";
  else if (inRoom && dist2(p,SHOP2) < 6) msg = "[E] ひみつショップ";
  else if (inRoom && dist2(p,DEXC) < 6) msg = "[E] ずかん";
  else if (inRoom && dist2(p,PORTAL) < 6) msg = "[E] もどる";
  else if (onBelt) msg = "W キーで走って特訓！（ジャンプでおりる）";
  else if (carried.length > 0) msg = "ホームのふ化きへ！（Y キーで その場に たまごをおける）";
  $("prompt").textContent = msg;
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $("toast").textContent = ""; }

  updateAtmos(dt,p); updateWeather(dt,p); updateGod(dt,p); updateNukes(dt); updateFx(dt,p); updateBats(dt,p,now); updatePlaced(dt,now); updateBoulders(dt,now); updateSkills(dt,now,p); updateArrows(dt,now); updateMars(dt);
  const cd = cfg.cam;
  camera.position.set(p.x + Math.sin(camYaw)*Math.cos(camPitch)*cd, p.y + 2.5 + Math.sin(camPitch)*cd, p.z + Math.cos(camYaw)*Math.cos(camPitch)*cd);
  if (inRoom) { camera.position.x = clamp(camera.position.x, ROOM.x-45, ROOM.x+45); camera.position.z = clamp(camera.position.z, ROOM.z-45, ROOM.z+45); camera.position.y = Math.min(camera.position.y, 32);
  }
  shake = Math.max(shake, shakeBoost); shakeBoost = Math.max(0, shakeBoost - dt*2.5);
  if (shake > 0) { camera.position.x += rand(-shake,shake); camera.position.y += rand(-shake,shake); shake = 0; }
  if (scoped) { camera.position.set(aim.x + Math.sin(camYaw)*3, 130, aim.z + Math.cos(camYaw)*3); camera.lookAt(aim.x, 0, aim.z); } else camera.lookAt(p.x, p.y+2.5, p.z);
  const spdNow = (moving && !onBelt) ? speed()*(flying() ? 1.4 : 1)*(riding ? (compK === 5 ? 6 : 3) : 1) : 0;
  const tf = scoped ? 26 : cfg.fov + Math.min(28, Math.max(0, spdNow-12)*.22);
  if (Math.abs(camera.fov - tf) > .05) { camera.fov += (tf-camera.fov)*Math.min(1, dt*5+.02); camera.updateProjectionMatrix(); }
  const sfo = Math.round(clamp((spdNow-25)/120, 0, .55)*20)/20; if (sfo !== speedFxV) { speedFxV = sfo; $("speedfx").style.opacity = sfo; }
  hemi.intensity = .95*cfg.light*wdim; sun.intensity = .6*cfg.light*wdim; player.scale.setScalar(cfg.playerScale);
  renderer.render(scene, camera);
}
let errShown = false;
function showErr(err) {
  console.error(err);
  if (errShown) return; errShown = true;
  const d = document.createElement("div"); d.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;background:#a01020e6;color:#fff;padding:8px 12px;border-radius:10px;font:13px sans-serif;z-index:99";
  d.textContent = "⚠ エラー: " + (err && err.message || err) + "（ページを更新してね）"; document.body.appendChild(d);
}
function frame() { try { frameBody(); } catch (err) { showErr(err); } requestAnimationFrame(frame); }
cvs.addEventListener("webglcontextlost", e => { e.preventDefault(); showErr("画面がとまりました"); });
frame();
</script>
