<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>カラフル・ロイヤル — 関町・吉祥寺バトル</title>
<meta name="description" content="吉祥寺・関町・上石神井がぶたいの、ペンキでたたかう3Dバトルロイヤル。">
<link rel="icon" type="image/x-icon" href="../../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1b3a;color:#fff;
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;font-weight:800;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hide{display:none!important}
.logo{font-family:'Dela Gothic One','M PLUS Rounded 1c',sans-serif;font-weight:400}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));text-align:center}
#loading{background:linear-gradient(160deg,#2b6cff,#7a3cff 60%,#ff4d8d);z-index:50}
#loading .bar{width:min(320px,70vw);height:14px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:22px}
#loading .bar i{display:block;height:100%;width:30%;border-radius:99px;background:#ffe14a;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{margin-left:-30%}100%{margin-left:100%}}
#title{background:linear-gradient(180deg,rgba(13,27,58,.15),rgba(13,27,58,.72) 62%,rgba(13,27,58,.92));justify-content:flex-end;gap:clamp(8px,2vh,18px);padding-bottom:max(22px,env(safe-area-inset-bottom))}
#title .top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
#title h1{font-size:clamp(40px,10.5vmin,112px);line-height:1.02;transform:rotate(-4deg);letter-spacing:.01em;
  color:#fff;-webkit-text-stroke:clamp(2px,.55vmin,6px) #14224d;paint-order:stroke fill;
  text-shadow:0 .06em 0 #14224d,.07em .12em 0 #ff4d8d,.13em .19em 0 #ffc21a}
#title h1 span{display:inline-block;color:#ffe14a}
#title .sub{margin-top:clamp(10px,2.6vh,26px);font-size:clamp(14px,2.8vmin,24px);background:#14224d;padding:.35em 1.1em;border-radius:99px;transform:rotate(-4deg);border:3px solid #fff}
.opts{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;align-items:center}
.opt{display:flex;align-items:center;gap:8px}
.opt>b{font-size:13px;opacity:.9;letter-spacing:.08em}
.seg{display:flex;background:rgba(10,18,44,.7);border-radius:14px;padding:4px;gap:4px;border:2px solid rgba(255,255,255,.25)}
.seg button{background:transparent;border-radius:10px;padding:8px 14px;font-size:clamp(13px,2.2vmin,16px);min-height:44px}
.seg button.on{background:#fff;color:#14224d}
.sw{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.35);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.sw.on{border-color:#fff;transform:scale(1.12)}
.big{font-size:clamp(20px,4.4vmin,34px);padding:.5em 2.2em;border-radius:20px;color:#3a2a00;
  background:linear-gradient(180deg,#fff06a,#ffc21a);box-shadow:0 7px 0 #b97c00,0 14px 26px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #b97c00,0 6px 12px rgba(0,0,0,.35)}
.big.blue{background:linear-gradient(180deg,#8fd0ff,#3d8bff);color:#04214f;box-shadow:0 7px 0 #1a4fae,0 14px 26px rgba(0,0,0,.35)}
.how{font-size:clamp(12px,1.9vmin,14px);font-weight:700;opacity:.92;line-height:1.7;max-width:760px}
.how kbd{display:inline-block;background:#fff;color:#14224d;border-radius:6px;padding:0 .5em;margin:0 .15em;font:inherit;font-weight:900;box-shadow:0 2px 0 #9aa7c7}
.back{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));font-size:13px;color:#fff;text-decoration:none;background:rgba(10,18,44,.65);padding:12px 16px;border-radius:99px;border:2px solid rgba(255,255,255,.3)}
#mute{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:45;width:44px;height:44px;border-radius:50%;background:rgba(10,18,44,.65);border:2px solid rgba(255,255,255,.3);font-size:12px}
body.playing #mute{display:none}

#mapsel{background:rgba(13,27,58,.86);gap:12px}
#mapsel h2{font-size:clamp(18px,4vmin,30px)}
#mapsel p{font-size:clamp(12px,2.2vmin,15px);font-weight:700;opacity:.9}
#mapwrap{position:relative;height:min(70vh,calc(88vw * 1.4));aspect-ratio:300/420;border-radius:16px;border:4px solid #fff;box-shadow:0 14px 40px rgba(0,0,0,.5)}
#mapwrap canvas{width:100%;height:100%;display:block;border-radius:12px}
.pin{position:absolute;transform:translate(-50%,-100%);background:#ff4d5a;border:3px solid #fff;border-radius:14px;padding:8px 11px;font-size:clamp(12px,1.9vmin,15px);white-space:nowrap;box-shadow:0 5px 0 rgba(0,0,0,.35);animation:bob 1.2s ease-in-out infinite}
.pin::after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff}
.pin:nth-child(odd){animation-delay:.4s}
.pin:hover,.pin:active{background:#ffc21a;color:#3a2a00}
@keyframes bob{50%{margin-top:-6px}}

#result{background:radial-gradient(circle at 50% 40%,rgba(20,34,77,.55),rgba(8,14,34,.92));gap:16px}
#result h2{font-size:clamp(40px,11vmin,110px);line-height:1.05;transform:rotate(-3deg);-webkit-text-stroke:clamp(2px,.5vmin,5px) #14224d;paint-order:stroke fill;text-shadow:0 .06em 0 #14224d,.08em .14em 0 #ff4d8d}
#result.win h2{color:#ffe14a}
#result .rank{font-size:clamp(18px,4vmin,30px)}
#result .rank b{font-size:1.7em;color:#ffe14a}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stats div{background:rgba(10,18,44,.75);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 18px;min-width:110px}
.stats small{display:block;font-size:12px;opacity:.8}
.stats b{font-size:24px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#pause{background:rgba(8,14,34,.78);gap:18px;z-index:40}
#pause h2{font-size:clamp(28px,6vmin,48px)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;
  --sl:max(12px,env(safe-area-inset-left));--sr:max(12px,env(safe-area-inset-right));--st:max(10px,env(safe-area-inset-top));--sb:max(12px,env(safe-area-inset-bottom))}
.panel{background:rgba(10,18,44,.62);border:2px solid rgba(255,255,255,.22);border-radius:12px;text-shadow:0 2px 0 rgba(0,0,0,.45)}
#storm{position:absolute;top:var(--st);left:50%;transform:translateX(-50%) skewX(-6deg);padding:6px 16px;font-size:clamp(12px,2.2vmin,16px);white-space:nowrap;display:flex;gap:8px;align-items:center}
#storm i{width:12px;height:12px;border-radius:50%;background:#b46bff;box-shadow:0 0 0 3px rgba(180,107,255,.35)}
#storm.warn{background:rgba(120,40,200,.8);animation:pulse .6s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.35)}}
#mini{position:absolute;top:var(--st);right:var(--sr);width:clamp(84px,17vmin,132px);aspect-ratio:300/420;border-radius:12px;border:3px solid #fff;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.4);background:#223}
#mini canvas{width:100%;height:100%;display:block}
#counts{position:absolute;right:calc(var(--sr) + clamp(84px,17vmin,132px) + 10px);top:var(--st);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#counts div{padding:4px 12px;font-size:clamp(12px,2.1vmin,15px);transform:skewX(-6deg);white-space:nowrap}
#counts b{font-size:1.35em;color:#ffe14a;margin-left:6px}
#feed{position:absolute;left:var(--sl);top:var(--st);display:flex;flex-direction:column;gap:5px;align-items:flex-start;max-width:46vw}
#feed div{padding:4px 10px;font-size:clamp(12px,1.8vmin,13px);font-weight:700;border-radius:8px;background:rgba(10,18,44,.6);animation:fin .25s ease-out;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#feed div.me{background:rgba(255,194,26,.92);color:#3a2a00}
@keyframes fin{from{opacity:0;transform:translateX(-14px)}}
#banner{position:absolute;top:19%;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .4s;white-space:nowrap}
#banner.on{opacity:1}
#banner b{display:block;font-size:clamp(22px,5.4vmin,46px);-webkit-text-stroke:4px #14224d;paint-order:stroke fill;letter-spacing:.06em}
#banner small{font-size:clamp(11px,2vmin,15px);background:#14224d;padding:2px 12px;border-radius:99px}
#big{position:absolute;top:33%;left:50%;transform:translate(-50%,-50%);font-size:clamp(20px,5vmin,40px);color:#ffe14a;-webkit-text-stroke:4px #14224d;paint-order:stroke fill;opacity:0;white-space:nowrap}
#big.on{animation:bigpop 1.6s ease-out forwards}
@keyframes bigpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
#cross{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px}
#cross i{position:absolute;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.55);border-radius:2px}
#cross i:nth-child(1){left:16px;top:0;width:3px;height:10px}#cross i:nth-child(2){left:16px;bottom:0;width:3px;height:10px}
#cross i:nth-child(3){top:16px;left:0;height:3px;width:10px}#cross i:nth-child(4){top:16px;right:0;height:3px;width:10px}
#cross i:nth-child(5){left:15px;top:15px;width:4px;height:4px;border-radius:50%}
#cross.enemy i{background:#ff4d5a}
#cross.hit{animation:hitm .18s ease-out}
@keyframes hitm{0%{transform:scale(1.6) rotate(45deg)}100%{transform:scale(1) rotate(0)}}
#reload{position:absolute;left:50%;top:calc(50% + 30px);transform:translateX(-50%);width:70px;height:7px;border-radius:9px;background:rgba(0,0,0,.5);overflow:hidden;opacity:0}
#reload.on{opacity:1}#reload i{display:block;height:100%;background:#ffe14a;width:0}
#bars{position:absolute;left:var(--sl);bottom:var(--sb);width:clamp(150px,30vmin,270px);display:flex;flex-direction:column;gap:6px}
.bar{position:relative;height:clamp(16px,3vmin,22px);border-radius:8px;background:rgba(10,18,44,.7);border:2px solid rgba(255,255,255,.3);overflow:hidden;transform:skewX(-8deg)}
.bar i{position:absolute;inset:0;width:100%;transform-origin:left;transition:transform .15s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:clamp(12px,1.8vmin,13px);text-shadow:0 1px 2px rgba(0,0,0,.7)}
#bSh i{background:linear-gradient(180deg,#7fd6ff,#2f8cff)}#bHp i{background:linear-gradient(180deg,#8cf08a,#22b455)}
#bHp.low i{background:linear-gradient(180deg,#ff9a8a,#ff3d4d)}
#slots{position:absolute;right:var(--sr);bottom:var(--sb);display:flex;gap:7px;align-items:flex-end;pointer-events:auto}
.slot{position:relative;width:clamp(54px,10.5vmin,78px);height:clamp(50px,9.5vmin,70px);border-radius:10px;background:rgba(10,18,44,.62);border:3px solid rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .1s}
.slot.on{border-color:#fff;transform:translateY(-8px) scale(1.06)}
.slot svg{width:78%;height:auto}
.slot em{position:absolute;left:5px;top:2px;font-style:normal;font-size:12px}
.slot b{position:absolute;right:5px;bottom:1px;font-size:clamp(11px,2vmin,14px)}
.slot small{position:absolute;left:0;right:0;top:-19px;font-size:12px;text-align:center;white-space:nowrap;display:none;text-shadow:0 1px 2px #000}
.slot.on small{display:block}
#mats{width:clamp(46px,8.5vmin,62px);height:clamp(50px,9.5vmin,70px);border-radius:10px;background:rgba(122,78,40,.8);border:3px solid rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
#mats b{font-size:clamp(15px,2.8vmin,20px)}
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);padding:8px 16px;font-size:clamp(12px,2.2vmin,16px);pointer-events:auto;white-space:nowrap}
#prompt kbd{background:#fff;color:#14224d;border-radius:6px;padding:0 .5em;margin-right:.4em;font:inherit}
#hint kbd{background:#fff;color:#14224d;border-radius:5px;padding:0 .45em;margin:0 .12em;font:inherit;text-shadow:none}
#hint{position:absolute;left:50%;bottom:calc(var(--sb) + 4px);transform:translateX(-50%);font-size:clamp(11px,1.9vmin,14px);font-weight:700;padding:6px 14px;white-space:nowrap;transition:opacity .5s}
#dmg{position:absolute;inset:0;overflow:hidden}
#dmg b{position:absolute;font-size:22px;color:#fff;-webkit-text-stroke:3px #14224d;paint-order:stroke fill;transform:translate(-50%,-50%);animation:dm .7s ease-out forwards;will-change:transform,opacity}
#dmg b.h{color:#ffe14a;font-size:30px}#dmg b.s{color:#7fd6ff}
@keyframes dm{0%{margin-top:0;opacity:1;scale:1.4}20%{scale:1}100%{margin-top:-56px;opacity:0}}
#ebar{position:absolute;transform:translate(-50%,-100%);text-align:center;font-size:12px;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 2px #000;display:none}
#ebar i{display:block;width:74px;height:8px;margin:2px auto 0;border-radius:6px;background:rgba(10,18,44,.75);border:1.5px solid #fff;overflow:hidden}
#ebar u{display:block;height:100%;background:#ff4d5a;text-decoration:none}
#hurt{position:absolute;inset:0;box-shadow:inset 0 0 120px 40px rgba(255,40,70,.75);opacity:0;transition:opacity .35s}
#tint{position:absolute;inset:0;background:radial-gradient(circle,rgba(150,70,255,.12),rgba(120,40,220,.5));opacity:0;transition:opacity .4s}
#hurtdir{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0;transition:opacity .5s}
#hurtdir::before{content:"";position:absolute;left:-16px;top:-150px;border:16px solid transparent;border-bottom:22px solid rgba(255,50,80,.85);border-top:0;filter:drop-shadow(0 0 6px rgba(0,0,0,.4))}

/* touch */
#touch{position:fixed;inset:0;z-index:9;display:none}
.tbtn{position:absolute;border-radius:50%;background:rgba(10,18,44,.5);border:3px solid rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;font-size:13px;pointer-events:auto;text-shadow:0 1px 2px #000}
.tbtn.act{background:rgba(255,255,255,.4)}
body.touch.playing #touch{display:block}
body.touch .tbtn{display:flex}
#tFire{right:calc(var(--sr) + 16px);bottom:calc(var(--sb) + 96px);width:92px;height:92px;background:rgba(225,50,70,.8);font-size:16px}
#tJump{right:calc(var(--sr) + 122px);bottom:calc(var(--sb) + 84px);width:64px;height:64px}
#tBuild{right:calc(var(--sr) + 96px);bottom:calc(var(--sb) + 164px);width:60px;height:60px;background:rgba(130,80,36,.85)}
#tAuto{left:var(--sl);top:calc(var(--st) + 100px);width:auto;height:auto;min-height:36px;border-radius:99px;padding:6px 12px;font-size:12px}
#tPause{left:var(--sl);top:var(--st);width:40px;height:40px;font-size:14px;letter-spacing:2px}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.45);background:rgba(10,18,44,.3);display:none;margin:-60px 0 0 -60px}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.75)}
body.touch #hint{display:none}
body.touch #bars{bottom:auto;top:calc(var(--st) + 46px);left:var(--sl)}
body.touch #feed{top:calc(var(--st) + 142px)}
body.touch #storm{left:calc(var(--sl) + 48px);transform:skewX(-6deg)}
.tbtn{background:rgba(10,18,44,.72)}
.slot em,.slot b{text-shadow:0 1px 2px #000,0 0 2px #000}
@media (max-width:600px){#counts{right:var(--sr);top:calc(var(--st) + clamp(84px,17vmin,132px)*1.4 + 8px)}#storm{padding:6px 10px}}
@media (max-height:420px){#banner{top:15%}#big{top:40%}}
@media (max-height:340px){#mini{width:64px}#counts{right:calc(var(--sr) + 74px)}}
@media (orientation:portrait){body.touch #prompt{bottom:calc(var(--sb) + 260px)}#mute{bottom:auto;top:max(12px,env(safe-area-inset-top))}}
@media (max-height:420px){#title .sub{display:none}.how{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="touch"><div id="joy"><i></i></div></div>

<div id="hud" class="hide">
  <div id="hurt"></div><div id="tint"></div><div id="hurtdir"></div>
  <div id="dmg"></div><div id="ebar"><span></span><i><u></u></i></div>
  <div id="feed"></div>
  <div id="storm" class="panel"><i></i><span id="stormTxt"></span></div>
  <div id="counts"><div class="panel">のこり<b id="cAlive">20</b></div><div class="panel">たおした<b id="cKills">0</b></div></div>
  <div id="mini"><canvas id="miniC"></canvas></div>
  <div id="banner"><b id="banName"></b><small id="banSub"></small></div>
  <div id="big"></div>
  <div id="cross"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="reload"><i></i></div>
  <div id="bars">
    <div class="bar" id="bSh"><i></i><span><u style="text-decoration:none">シールド</u><b id="tSh">0</b></span></div>
    <div class="bar" id="bHp"><i></i><span><u style="text-decoration:none">たいりょく</u><b id="tHp">100</b></span></div>
  </div>
  <div id="slots"></div>
  <div id="prompt" class="panel hide"></div>
  <div id="hint" class="panel"></div>
  <button class="tbtn" id="tFire">うつ</button>
  <button class="tbtn" id="tJump">ジャンプ</button>
  <button class="tbtn" id="tBuild">かべ</button>
  <button class="tbtn" id="tAuto">オート: ON</button>
  <button class="tbtn" id="tPause" aria-label="ひとやすみ">II</button>
</div>

<div id="loading" class="screen">
  <div class="logo" style="font-size:clamp(28px,7vmin,60px)">カラフル・ロイヤル</div>
  <div id="loadTxt" style="margin-top:10px;font-size:14px">まちを つくっています…</div>
  <div class="bar"><i></i></div>
</div>

<div id="title" class="screen hide">
  <a class="back" href="../">← Apps</a>
  <div class="top">
    <h1 class="logo">カラフル・<span>ロイヤル</span></h1>
    <div class="sub">関町・吉祥寺・上石神井 ペンキバトル!</div>
  </div>
  <div class="opts">
    <div class="opt"><b>つよさ</b><div class="seg" id="segDiff">
      <button data-v="easy" class="on">やさしい</button><button data-v="normal">ふつう</button><button data-v="hard">むずかしい</button></div></div>
    <div class="opt"><b>いろ</b><div id="segCol" style="display:flex;gap:8px"></div></div>
  </div>
  <button class="big" id="btnPlay">あそぶ!</button>
  <div class="how" id="how"></div>
</div>

<div id="mapsel" class="screen hide">
  <h2>どこに おりる?</h2>
  <p>ばしょを えらんでね。さいごの ひとりに なったら かち!</p>
  <div id="mapwrap"><canvas id="bigMap"></canvas></div>
</div>

<div id="pause" class="screen hide">
  <h2>ひとやすみ中</h2>
  <p style="font-size:14px;font-weight:700">「つづける」を おすと マウスで ねらえるよ</p>
  <div class="row"><button class="big" id="btnResume">つづける</button><button class="big blue" id="btnQuit">タイトルへ</button></div>
</div>

<div id="result" class="screen hide">
  <h2 class="logo" id="resTitle"></h2>
  <div class="rank" id="resRank"></div>
  <div class="stats">
    <div><small>たおした ロボ</small><b id="resKills">0</b></div>

}

  for(const c of chests){ dyn.remove(c.g); c.g.traverse(m=>{ if(m.isMesh&&m.geometry!==beamGeo) m.geometry.dispose(); }); }
  for(const w of walls.slice()){ removeCol(w.col); dyn.remove(w.m); }

  $('feed').innerHTML=''; $('dmg').innerHTML='';
}

function updateTrains(dt){ for(const t of trains){
    if(t.mode==='wait'){ t.t-=dt; if(t.t<=0){ t.mode='in'; t.x=-340*t.dir; t.k=0; } }

  mg.strokeStyle='#d7b3ff'; mg.lineWidth=2; mg.beginPath(); mg.arc(tx(storm.cx),tz(storm.cz),Math.max(.1,storm.r*s),0,6.3); mg.stroke();

  const p=player; if(Math.hypot(p.x-storm.nx,p.z-storm.nz)>storm.nr){ mg.strokeStyle='rgba(255,255,255,.9)'; mg.lineWidth=1.5; mg.beginPath(); mg.moveTo(tx(p.x),tz(p.z)); mg.lineTo(tx(storm.nx),tz(storm.nz)); mg.stroke(); }
  mg.save(); mg.translate(tx(p.x),tz(p.z)); mg.rotate(-p.yaw); mg.fillStyle=hexCss(p.color); mg.strokeStyle='#fff'; mg.lineWidth=2.5; mg.beginPath(); mg.moveTo(0,10); mg.lineTo(-7,-7); mg.lineTo(0,-3); mg.lineTo(7,-7); mg.closePath(); mg.fill(); mg.stroke(); mg.restore(); }
function updateHud(dt){
  const p=player; hudAcc+=dt;
  $('bHp').firstElementChild.style.transform=`scaleX(${clamp(p.hp/100,0,1)})`; $('bSh').firstElementChild.style.transform=`scaleX(${clamp(p.shield/100,0,1)})`;
  $('tHp').textContent=Math.max(0,Math.ceil(p.hp)); $('tSh').textContent=Math.ceil(p.shield); $('bHp').classList.toggle('low',p.hp<=30);
  const eb=$('ebar'), en=aim.enemy; if(en&&en.alive){ _pv.set(en.x,en.y+2.75,en.z).project(camera); if(_pv.z<1){ eb.style.display='block'; eb.style.left=((_pv.x*.5+.5)*innerWidth)+'px'; eb.style.top=((-_pv.y*.5+.5)*innerHeight)+'px'; eb.firstChild.textContent=en.name; eb.lastChild.firstChild.style.width=clamp(en.hp/DIFF.botHp*100,0,100)+'%'; } } else eb.style.display='none';
  $('cross').classList.toggle('enemy',!!aim.enemy); $('cross').style.opacity=p.dropping||endT>=0?0:1;
  if(hurtT>0){ hurtT-=dt; if(hurtT<=0) $('hurt').style.opacity=0; } if(hurtDirT>0){ hurtDirT-=dt; if(hurtDirT<=0) $('hurtdir').style.opacity=0; }
  if(banT>0){ banT-=dt; if(banT<=0) $('banner').classList.remove('on'); }
  const out=(p.x-storm.cx)**2+(p.z-storm.cz)**2>storm.r*storm.r; $('tint').style.opacity=out?1:0;
  const k=out?1:0; sky.material.uniforms.mixS.value=lerp(sky.material.uniforms.mixS.value,k,dt*3); scene.fog.color.copy(FOG_DAY).lerp(FOG_STORM,sky.material.uniforms.mixS.value*.8);
  if(hudAcc>.1){ hudAcc=0; drawMini();
    if(!p.dropping){ let zn=''; for(const z of ZONES){ if(p.x>=z[2]&&p.x<=z[3]&&p.z>=z[4]&&p.z<=z[5]){ zn=z[0]; if(zn!==lastZone){ lastZone=zn; banner(z[0],z[1]); } break; } } } }
}

/* ============================================================ main update */
function update(dt){
  T_now+=dt; updateTrains(dt);
  if(clouds){ clouds.position.x=((T_now*1.6)%200)-100; }
  if(state==='title'||state==='map'){ camYawTitle+=dt*.07; const cx=0, cz=40; camera.position.set(cx+Math.sin(camYawTitle)*170,62,cz+Math.cos(camYawTitle)*190); camera.lookAt(cx,0,cz); sun.target.position.set(0,0,40); sun.position.copy(sun.target.position).add(SUN_OFF); sky.position.copy(camera.position); stormMesh.visible=false; updateParts(dt); return; }
  stormMesh.visible=true;
  if(endT>=0){ endT+=dt; if(endWin&&Math.random()<.5) confetti(player.x,player.y,player.z,3); if(!resultShown&&endT>(endWin?4.2:1.8)) showResult(); }
  else matchT+=dt;
  const sdt=endT>=0&&endWin?dt*.5:dt;
  updatePlayer(sdt); for(const b of bots) updateBot(b,sdt);
  updateStorm(sdt);
  for(const a of actors){ if(a.alive) animChar(a,sdt); }
  // pickups anim
  for(const k of pickups){ k.t+=dt; if(k.cool>0)k.cool-=dt; k.m.rotation.y=k.t*1.6; k.m.position.y=.95+Math.sin(k.t*2.4)*.12;
    if(k.pop){ k.pop.t+=dt*2.4; const e=Math.min(1,k.pop.t); k.g.position.set(lerp(k.pop.fx,k.x,e),Math.sin(e*Math.PI)*2.2,lerp(k.pop.fz,k.z,e)); if(e>=1){ k.pop=null; k.g.position.y=0; } } }
  for(const c of chests){ if(!c.open){  if(Math.random()<.02&&dist2(c,player)<1600) particle(c.x+R(-.6,.6),.7,c.z+R(-.4,.4),0,R(1.5,3),0,.8,.09,0xffe14a,0); } }
  for(const w of walls){ if(w.t<1){ w.t=Math.min(1,w.t+dt*7); w.m.scale.y=3.4*(.2+.8*w.t); w.m.position.y=w.col.y0+w.m.scale.y/2; } }
  updateCamera(dt);
  if(player.alive&&!player.dropping&&endT<0) computeAim(); else aim.enemy=null;
  updateBullets(sdt); updateParts(dt);
  sun.target.position.set(Math.round(player.x/2)*2,0,Math.round(player.z/2)*2); sun.position.copy(sun.target.position).add(SUN_OFF); sky.position.copy(camera.position);
  updateHud(dt);
}
let last=0;
function frame(now){ requestAnimationFrame(frame); const dt=Math.min(.05,(now-last)/1000||0); last=now; if(state==='load')return;
  if(state==='play'&&!TOUCH&&!noLock&&!paused&&endT<0&&document.pointerLockElement!==canvas&&now-lockReqT>1500) setPause(true); if(!paused) update(dt); renderer.render(scene,camera); }
function resize(){ const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize);

/* ============================================================ input */
const canvas=$('c');
let lockReqT=0, lockFails=0; if(/nolock/.test(location.search)||!canvas.requestPointerLock) noLock=true;
function lockFail(){ if(++lockFails>=2) noLock=true; }
function lockPointer(){ if(TOUCH||noLock)return; lockReqT=performance.now(); try{ const r=canvas.requestPointerLock(); if(r&&r.catch) r.catch(()=>{}); }catch(e){ lockFail(); } }
document.addEventListener('pointerlockerror',lockFail);
document.addEventListener('pointerlockchange',()=>{ if(document.pointerLockElement===canvas){ lockFails=0; } else if(state==='play'&&endT<0&&!noLock&&!TOUCH){ setPause(true); } });
function setPause(v){ if(state!=='play'||endT>=0)return; paused=v; $('pause').classList.toggle('hide',!v); if(v){ firing=false; for(const k in keys)keys[k]=false; if(document.pointerLockElement) document.exitPointerLock(); } else { last=performance.now(); lockPointer(); } }
addEventListener('keydown',e=>{ if(state!=='play'||endT>=0)return; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) e.preventDefault(); if(e.repeat)return; keys[e.code]=true;
  if(e.code==='Space') jumpQ=true; else if(e.code==='KeyQ'||e.code==='KeyF') buildQ=true; else if(e.code==='KeyE') swapQ=true; else if(e.code==='Digit1')selectSlot(0); else if(e.code==='Digit2')selectSlot(1); else if(e.code==='Digit3')selectSlot(2);
  else if(e.code==='KeyP'||(e.code==='Escape'&&noLock)) setPause(!paused); });
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for(const k in keys)keys[k]=false; firing=false; });
canvas.addEventListener('mousedown',e=>{ if(state!=='play'||paused||TOUCH||endT>=0)return; audio(); if(document.pointerLockElement!==canvas&&!noLock){ lockPointer(); } if(e.button===0) firing=true; else if(e.button===2) zoom=true; });
addEventListener('mouseup',e=>{ if(e.button===0) firing=false; else if(e.button===2) zoom=false; });
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{ if(state!=='play'||paused||TOUCH||!player||endT>=0)return; if(document.pointerLockElement!==canvas&&!noLock)return; const s=.0023*(zoom?.5:1); player.yaw-=e.movementX*s; player.pitch=clamp(player.pitch-e.movementY*s,-1.2,1.15); });
addEventListener('wheel',e=>{ if(state!=='play'||!player)return; const n=player.slots.filter(Boolean).length; if(n<2)return; let i=player.cur; for(let k=0;k<3;k++){ i=(i+(e.deltaY>0?1:2))%3; if(player.slots[i]){ selectSlot(i); break; } } },{passive:true});
$('slots').addEventListener('click',e=>{ const s=e.target.closest('.slot'); if(s) selectSlot(+s.dataset.i); });
$('prompt').addEventListener('click',()=>{ swapQ=true; });
// touch
const tz_=$('touch'), joyEl=$('joy');
function look(dx,dy){ if(!player||endT>=0)return; player.yaw-=dx*.0052; player.pitch=clamp(player.pitch-dy*.0042,-1.2,1.15); }
tz_.addEventListener('touchstart',e=>{ e.preventDefault(); audio(); for(const t of e.changedTouches){ if(t.clientX<innerWidth*.42&&joy.id===null){ joy.id=t.identifier; joy.ox=t.clientX; joy.oy=t.clientY; joyEl.style.display='block'; joyEl.style.left=t.clientX+'px'; joyEl.style.top=t.clientY+'px'; joyEl.firstChild.style.transform=''; } else if(lookId===null){ lookId=t.identifier; lookX=t.clientX; lookY=t.clientY; } } },{passive:false});
function tmove(e){ e.preventDefault(); for(const t of e.changedTouches){ if(t.identifier===joy.id){ let dx=t.clientX-joy.ox, dy=t.clientY-joy.oy; const l=Math.hypot(dx,dy), m=52; if(l>m){ dx*=m/l; dy*=m/l; } joy.x=dx/m; joy.y=-dy/m; joyEl.firstChild.style.transform=`translate(${dx}px,${dy}px)`; } else if(t.identifier===lookId){ look(t.clientX-lookX,t.clientY-lookY); lookX=t.clientX; lookY=t.clientY; } } }
function tend(e){ for(const t of e.changedTouches){ if(t.identifier===joy.id){ joy.id=null; joy.x=joy.y=0; joyEl.style.display='none'; } if(t.identifier===lookId){ lookId=null; if(fireTouch){ firing=false; fireTouch=false; $('tFire').classList.remove('act'); } } } }
let fireTouch=false;
tz_.addEventListener('touchmove',tmove,{passive:false}); tz_.addEventListener('touchend',tend); tz_.addEventListener('touchcancel',tend);
const tf=$('tFire');
tf.addEventListener('touchstart',e=>{ e.preventDefault(); audio(); const t=e.changedTouches[0]; if(lookId===null){ lookId=t.identifier; lookX=t.clientX; lookY=t.clientY; fireTouch=true; } firing=true; tf.classList.add('act'); },{passive:false});
tf.addEventListener('touchmove',tmove,{passive:false}); tf.addEventListener('touchend',e=>{ firing=false; tf.classList.remove('act'); fireTouch=false; for(const t of e.changedTouches) if(t.identifier===lookId) lookId=null; }); tf.addEventListener('touchcancel',()=>{ firing=false; fireTouch=false; lookId=null; tf.classList.remove('act'); });
$('tJump').addEventListener('touchstart',e=>{ e.preventDefault(); jumpQ=true; },{passive:false});
$('tBuild').addEventListener('touchstart',e=>{ e.preventDefault(); buildQ=true; },{passive:false});
$('tAuto').addEventListener('touchstart',e=>{ e.preventDefault(); autoFire=!autoFire; $('tAuto').textContent='オート: '+(autoFire?'ON':'OFF'); },{passive:false});
$('tPause').addEventListener('touchstart',e=>{ e.preventDefault(); setPause(true); },{passive:false});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play'&&endT<0) setPause(true); });

/* ============================================================ menus */
function toTitle(){ state='title'; paused=false; resetMatch(); player=null; document.body.classList.remove('playing'); $('hud').classList.add('hide'); for(const s of['mapsel','result','pause']) $(s).classList.add('hide'); $('title').classList.remove('hide'); if(document.pointerLockElement) document.exitPointerLock(); camera.fov=64; camera.updateProjectionMatrix(); scene.fog.color.copy(FOG_DAY); scene.fog.near=80; scene.fog.far=340; sky.material.uniforms.mixS.value=0; }
function toMap(){ state='map'; resetMatch(); player=null; endT=-1; document.body.classList.remove('playing'); $('hud').classList.add('hide'); for(const s of['title','result','pause']) $(s).classList.add('hide'); $('mapsel').classList.remove('hide'); scene.fog.color.copy(FOG_DAY); sky.material.uniforms.mixS.value=0; camera.fov=64; camera.updateProjectionMatrix(); }
$('btnPlay').onclick=()=>{ audio(); SFX.click(); toMap(); };
$('btnAgain').onclick=()=>{ audio(); SFX.click(); toMap(); };
$('btnTitle').onclick=$('btnQuit').onclick=()=>{ SFX.click(); toTitle(); };
$('btnResume').onclick=()=>{ audio(); setPause(false); };
$('mute').onclick=()=>{ audio(); muted=!muted; if(master) master.gain.value=muted?0:.5; $('mute').textContent=muted?'音OFF':'音ON'; };
$('segDiff').onclick=e=>{ const b=e.target.closest('button'); if(!b)return; diffKey=b.dataset.v; for(const x of $('segDiff').children) x.classList.toggle('on',x===b); audio(); SFX.click(); };
PCOL.forEach((c,i)=>{ const b=document.createElement('button'); b.className='sw'+(i===1?' on':''); b.style.background=hexCss(c); b.setAttribute('aria-label',['あか','あお','みどり','きいろ'][i]); b.onclick=()=>{ pColor=c; for(const x of $('segCol').children) x.classList.toggle('on',x===b); audio(); SFX.click(); }; $('segCol').appendChild(b); });
$('how').innerHTML=TOUCH?'ひだりを なぞって うごく ・ みぎを なぞって ねらう ・ <b>うつ</b>ボタンで ペンキはっしゃ!<br>てきは いたずらロボット。あらしの わの なかで さいごまで いきのころう!'
  :'<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>うごく <kbd>マウス</kbd>ねらう <kbd>クリック</kbd>うつ <kbd>みぎクリック</kbd>ズーム <kbd>スペース</kbd>ジャンプ <kbd>Q</kbd>かべ <kbd>1</kbd>-<kbd>3</kbd>ぶき <kbd>E</kbd>こうかん <kbd>P</kbd>ひとやすみ<br>てきは いたずらロボット。あらしの わの なかで さいごまで いきのころう!';

/* ============================================================ boot */
async function boot(){
  try{ await Promise.race([Promise.all([document.fonts.load(`800 40px 'M PLUS Rounded 1c'`,'あア駅上石神井吉祥寺関町南立野小学校公園善福千川'),document.fonts.load(`400 40px 'Dela Gothic One'`,'カラフルロイヤル')]),new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  buildWorld();
  try{ await Promise.race([document.fonts.load(`800 40px 'M PLUS Rounded 1c'`,signs.map(s=>s.text).join('')),new Promise(r=>setTimeout(r,2000))]); }catch(e){}
  buildSigns();
  // ground
  const gc=document.createElement('canvas'); const maxT=renderer.capabilities.maxTextureSize; drawMap(gc,(TOUCH||maxT<4096)?3:6,false);
  const gt=new T.CanvasTexture(gc); gt.encoding=T.sRGBEncoding; gt.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  const ground=new T.Mesh(new T.PlaneGeometry(300,420),new T.MeshLambertMaterial({map:gt})); ground.rotation.x=-Math.PI/2; ground.position.set(0,0,20); ground.receiveShadow=true; scene.add(ground);
  drawMap(mapSmall,.8,true);
  // big map + pins
  const bm=$('bigMap'); drawMap(bm,2.4,true); const g=bm.getContext('2d'); g.setTransform(2.4,0,0,2.4,150*2.4,190*2.4);
  const wrap=$('mapwrap');
  for(const d of DROPS){ const b=document.createElement('button'); b.className='pin'; b.textContent=d.n; b.style.left=((d.x+150)/300*100)+'%'; b.style.top=((d.z+190)/420*100)+'%'; b.onclick=()=>{ audio(); SFX.click(); startMatch(d); }; wrap.appendChild(b); }
  initTrains(); resize();
  $('loading').classList.add('hide'); toTitle(); requestAnimationFrame(frame);
}
if(/nolock|debug/.test(location.search)) window.__cr={ info:renderer.info, get s(){ return {state,player,bots,actors,storm,chests,pickups,walls,endT,endWin,endRank,matchT,colliders}; }, start:d=>startMatch(d||DROPS[0]), sim(sec){ for(let t=0;t<sec;t+=1/30){ if(state==='play'&&!resultShown) update(1/30); } }, cam:camera, setKey(k,v){ keys[k]=v; }, fire(v){ firing=v; } };
setTimeout(boot,60);
})();
