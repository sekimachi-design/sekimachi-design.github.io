<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>セーラークエスト3D</title>
<style>
:root{--bg:#0b1020;--glass:rgba(16,22,46,.86);--line:rgba(120,170,255,.35);--acc:#5cc8ff;--acc2:#ff6bd5;--ink:#eaf2ff;--mut:#8fa3c8}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif}
canvas#game,canvas#ov{position:fixed;inset:0;width:100%;height:100%;display:block}canvas#ov{pointer-events:none}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
.hud{position:fixed;pointer-events:none}
#card{left:12px;top:12px;width:300px;background:var(--glass);border:2px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 0 24px #0008}

#card .nm{font-size:18px;font-weight:800}
.bar{height:14px;border-radius:8px;background:#0007;overflow:hidden;margin-top:6px;position:relative;border:1px solid #fff2}
.bar i{display:block;height:100%;border-radius:8px;transition:width .15s}
.bar span{position:absolute;inset:0;font-size:10px;text-align:center;line-height:13px;font-weight:700;text-shadow:0 1px 2px #000}
#hp i{background:linear-gradient(90deg,#ff3d6b,#ff8a5c)}
#xp i{background:linear-gradient(90deg,#3d8bff,#5cf0ff)}
#top{right:12px;top:12px;text-align:right;background:var(--glass);border:2px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:700}
#top small{display:block;color:var(--mut);font-weight:500}
#mini{right:12px;bottom:12px;border:2px solid var(--line);border-radius:14px;background:var(--glass);width:170px;height:124px}
#skills{left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
.sk{width:66px;height:66px;border-radius:14px;background:var(--glass);border:2px solid var(--line);position:relative;overflow:hidden;text-align:center;font-size:11px;padding-top:6px;line-height:1.25}

#menu{left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;pointer-events:auto}

#toasts{left:50%;top:70px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--glass);border:2px solid var(--line);padding:6px 16px;border-radius:20px;font-weight:700;animation:tin .25s,tout .5s 2.6s forwards}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}

#bossbar{left:50%;top:14px;transform:translateX(-50%);width:min(420px,40vw);text-align:center;display:none;font-weight:800;text-shadow:0 2px 4px #000}

#autoBadge{left:50%;top:78px;transform:translateX(-50%);color:#7dffb0;font-weight:800;display:none;text-shadow:0 0 8px #0f8}
#panel{position:fixed;inset:0;background:#000a;display:none;z-index:20;align-items:center;justify-content:center;padding:10px}
#panelBox{width:min(980px,100%);height:min(640px,100%);background:linear-gradient(160deg,#141c3a,#0b1126);border:2px solid var(--line);border-radius:20px;box-shadow:0 0 60px #4aa3ff44;display:flex;flex-direction:column;overflow:hidden}
#ptabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;align-items:center}
#ptabs button{border:2px solid var(--line);background:#ffffff0d;border-radius:12px;padding:8px 12px;white-space:nowrap;font-weight:700}
#ptabs button.on{background:linear-gradient(135deg,#2f7bff,#8f4dff);border-color:#fff8}
#ptabs .x{margin-left:auto;background:#ff4d6d55}
#pbody{padding:14px;overflow:auto;flex:1;-webkit-user-select:text;user-select:text}
h3{margin:14px 0 8px;font-size:16px;color:var(--acc)}
h3:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cardi{background:#ffffff0a;border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.cardi .ic{font-size:30px}.cardi .nm{font-weight:800}.cardi .ds{font-size:12px;color:var(--mut)}
.cardi.eq{box-shadow:inset 0 0 0 2px var(--acc2)}
.b{border:none;border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;background:linear-gradient(135deg,#2f7bff,#6a4dff)}
.b.g{background:linear-gradient(135deg,#17b86a,#0e8f7a)}.b.r{background:linear-gradient(135deg,#ff4d6d,#c0245e)}.b.y{background:linear-gradient(135deg,#ffb52e,#ff7b2e);color:#222}
.b:disabled{opacity:.35;cursor:not-allowed}
.rar{font-size:11px;font-weight:800}
.stat{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;margin:6px 0}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid #fff1;padding:3px 0;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}#card{width:220px}#skills .sk{width:52px;height:52px}}
input[type=range]{accent-color:var(--acc)}
input[type=text],textarea{background:#0006;border:2px solid var(--line);border-radius:10px;color:var(--ink);padding:6px 10px;font-family:inherit}
.chip{display:inline-block;padding:3px 8px;border-radius:10px;background:#ffffff14;margin:2px;font-size:12px}

.cardi{background:linear-gradient(160deg,#3a0f1a,#16060b)!important;border-color:#7a2434}
.cardi .ds{color:#d9a9b3}
.tier{display:flex;margin:4px 0;border:1px solid #fff2;border-radius:8px;overflow:hidden;background:#0007}
.tier .lab{width:64px;flex:none;display:grid;place-items:center;font-size:24px;font-weight:900;color:#1a1a1a}
.tier .tiles{display:flex;flex-wrap:wrap;gap:5px;padding:5px;min-height:84px;flex:1}
.tile{width:78px;height:78px;border:2px solid;border-radius:6px;background:linear-gradient(160deg,#4a0f1c,#1c050b);text-align:center;position:relative;padding-top:4px;font-size:9px;line-height:1.15;overflow:hidden}
.tile .ti{font-size:28px;line-height:34px}.tile .tn{font-weight:800;padding:0 2px}.tile .tx{position:absolute;right:3px;bottom:1px;color:#fff;font-weight:800;font-size:10px}
.tile.dim{opacity:.38;filter:grayscale(.6)}
.pbar{height:10px;background:#0008;border-radius:6px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#17b86a,#5cf0c0)}
#menu{max-height:calc(100vh - 150px);flex-wrap:wrap;gap:6px}#menu button{width:50px;height:50px;font-size:20px}
.sk{width:60px;height:60px}
#banner{left:0;right:0;top:20%;text-align:center;z-index:14;opacity:0}
#banner .bn{font-size:clamp(34px,7vw,88px);font-weight:900;font-style:italic;letter-spacing:.08em;color:#fff;text-shadow:0 0 18px var(--c),0 0 44px var(--c),4px 4px 0 #000;-webkit-text-stroke:2px var(--c)}
#banner .bs{font-size:clamp(14px,2.4vw,28px);font-weight:800;color:#fff;letter-spacing:.4em;text-shadow:0 0 12px var(--c),2px 2px 0 #000}
#banner.go{animation:bnr 1.5s ease-out}
@keyframes bnr{0%{opacity:0;transform:scale(2.6) skewX(-14deg)}12%{opacity:1;transform:scale(1) skewX(-8deg)}78%{opacity:1}100%{opacity:0;transform:scale(1.12) translateY(-24px)}}
#flash{inset:0;z-index:13;opacity:0}
#hk i{background:linear-gradient(90deg,#7a1fff,#ff2a5c)}#hk{height:10px}#hk span{font-size:8px;line-height:9px}#t-gold{pointer-events:auto;cursor:pointer}
#as{right:60px;top:108px;width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--glass);font-size:20px;pointer-events:auto;cursor:pointer;color:var(--ink)}#fy{right:66px;bottom:150px;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--glass);pointer-events:auto;cursor:pointer;color:var(--ink)}#jb{right:12px;bottom:150px;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--glass);pointer-events:auto;cursor:pointer;color:var(--ink)}#hb{right:108px;top:108px;width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--glass);pointer-events:auto;cursor:pointer;color:var(--ink)}#fs{right:12px;top:108px;width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--glass);font-size:22px;pointer-events:auto;cursor:pointer;color:var(--ink)}#fs:hover{border-color:var(--acc)}
#cine{inset:0;z-index:16;opacity:0;overflow:hidden}
#cine .tb,#cine .bb{position:absolute;left:0;right:0;background:#000;height:0}#cine .tb{top:0}#cine .bb{bottom:0}
#cine .lines{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0 1.5deg,transparent 1.5deg 7deg);-webkit-mask-image:radial-gradient(circle,transparent 22%,#000 75%);mask-image:radial-gradient(circle,transparent 22%,#000 75%);animation:cinspin 4s linear infinite}
#cine .cut{position:absolute;left:0;right:0;top:36%;padding:20px 0 20px 14%;display:flex;align-items:center;gap:24px;color:#fff;background:linear-gradient(100deg,transparent 0,var(--c) 18%,rgba(0,0,0,.78) 62%,transparent 100%);transform:translateX(-110%) skewX(-12deg);box-shadow:0 0 50px var(--c)}
#cine .ico{font-size:clamp(56px,10vw,120px);filter:drop-shadow(0 0 18px var(--c))}
#cine .cn{font-size:clamp(30px,6vw,76px);font-weight:900;font-style:italic;letter-spacing:.06em;text-shadow:0 0 18px var(--c),4px 4px 0 #000;-webkit-text-stroke:1.5px var(--c)}
#cine .cs{font-size:clamp(14px,2.6vw,30px);font-weight:800;letter-spacing:.35em;color:#fff;text-shadow:0 0 12px var(--c),2px 2px 0 #000}
#cine.go{animation:cinfade var(--d) linear forwards}#cine.go .tb,#cine.go .bb{animation:cinbar var(--d) ease-out forwards}#cine.go .cut{animation:cincut var(--d) cubic-bezier(.2,.9,.2,1) forwards}
@keyframes cinfade{0%{opacity:0}6%{opacity:1}90%{opacity:1}100%{opacity:0}}
@keyframes cinbar{0%{height:0}12%{height:14vh}88%{height:14vh}100%{height:0}}
@keyframes cincut{0%{transform:translateX(-110%) skewX(-12deg)}12%{transform:translateX(0) skewX(-12deg)}34%{transform:translateX(2%) skewX(-12deg)}48%{transform:translateX(120%) skewX(-12deg)}100%{transform:translateX(120%) skewX(-12deg)}}
@keyframes cinspin{to{transform:rotate(360deg)}}
.ico{width:1em;height:1em;vertical-align:-.15em;display:inline-block}.cardi .ic .ico{width:34px;height:34px}.tile .ti .ico{width:34px;height:34px;vertical-align:middle}.sk b .ico{width:26px;height:26px}
#menu button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px currentColor)}#ptabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}#ptabs button span{margin-left:6px;vertical-align:middle}.sk b svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}

#panelBox{position:relative}#ptabs{position:relative;z-index:2}#pbody{position:relative;z-index:1}
#panelBox.admin{background:radial-gradient(1200px 520px at 15% -10%,rgba(122,31,255,.35),transparent),radial-gradient(900px 520px at 105% 115%,rgba(0,229,255,.25),transparent),#06040f;border:2px solid #ff3a8a;box-shadow:0 0 40px rgba(255,58,138,.55),0 0 120px rgba(0,229,255,.3),inset 0 0 60px rgba(122,31,255,.25);animation:admPulse 3s ease-in-out infinite}

#panelBox.admin::before{content:'';position:absolute;left:0;right:0;height:140px;top:-140px;background:linear-gradient(transparent,rgba(0,229,255,.16),transparent);animation:admScan 4.5s linear infinite;pointer-events:none;z-index:4}

#admFx{position:absolute;inset:0;width:100%;height:100%;opacity:.4;pointer-events:none;z-index:0}

.admHead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.admTitle{font-size:clamp(26px,5vw,50px);font-weight:900;font-style:italic;letter-spacing:.14em;background:linear-gradient(90deg,#ff3a8a,#ffd54a,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:glitch 3.2s infinite;filter:drop-shadow(0 0 12px rgba(255,58,138,.8))}
@keyframes glitch{0%,91%,100%{transform:none}92%{transform:translate(-4px,1px) skewX(6deg)}94%{transform:translate(4px,-1px)}96%{transform:translate(-2px,0) skewX(-6deg)}}
.admSub{color:#7fe8ff;letter-spacing:.35em;font-size:11px}
.admDot{width:10px;height:10px;border-radius:50%;background:#43ff8a;box-shadow:0 0 12px #43ff8a;animation:admBlink 1.2s infinite;display:inline-block;margin-right:6px}

.admHero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
.admStat{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(0,229,255,.5);padding:10px 14px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));animation:admIn .6s both}
.admStat small{display:block;color:#7fe8ff;letter-spacing:.3em;font-size:10px}

.admDmgBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
#panelBox.admin .cardi{background:linear-gradient(160deg,#1a0a2e,#0a0618)!important;border:1px solid rgba(255,58,138,.6);border-radius:4px;animation:admIn .5s both;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}

@keyframes admIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
#panelBox.admin .cardi:hover{border-color:#00e5ff;box-shadow:0 0 22px rgba(0,229,255,.45)}
#panelBox.admin .b{border-radius:3px;border:1px solid rgba(0,229,255,.7);background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(255,58,138,.15));box-shadow:0 0 10px rgba(0,229,255,.3);letter-spacing:.06em;transition:.15s}
#panelBox.admin .b:hover{transform:translateY(-2px);box-shadow:0 0 22px #ff3a8a;background:linear-gradient(135deg,rgba(0,229,255,.4),rgba(255,58,138,.4))}

#panelBox.admin .b.g{border-color:#43ff8a;background:linear-gradient(135deg,rgba(67,255,138,.25),rgba(0,229,255,.15))}
#panelBox.admin input,#panelBox.admin select{background:#0a0618;border:1px solid rgba(0,229,255,.6);color:#fff;border-radius:3px}
#panelBox.admin h3{color:#00e5ff;text-shadow:0 0 10px #00e5ff;letter-spacing:.2em}
.admBoot{position:absolute;inset:0;background:#030108;z-index:6;padding:34px;font-family:ui-monospace,Menlo,monospace;color:#43ff8a;font-size:14px;line-height:1.9;animation:admBootOut 1.8s forwards;pointer-events:none}
.admBoot div{opacity:0;animation:admLine .15s forwards}
@keyframes admLine{to{opacity:1}}
@keyframes admBootOut{0%,78%{opacity:1}100%{opacity:0;visibility:hidden}}
@media (max-height:540px){#card{width:210px;padding:6px 9px;top:6px;left:6px}#card .nm{font-size:14px}#card .bar{height:10px;margin-top:3px}#menu{top:92px;left:6px;transform:none;max-height:calc(100vh - 150px);gap:4px}#menu button{width:34px;height:34px;border-radius:9px}#menu button svg{width:18px;height:18px}.sk{width:44px;height:44px;font-size:8px;padding-top:3px}.sk span{display:none}.sk b svg,.sk b .ico{width:18px;height:18px}#skills{gap:4px;bottom:6px}#mini{width:112px;height:82px;right:6px;bottom:6px}#top{padding:4px 9px;font-size:12px;right:6px;top:6px}#fs,#as{top:62px;width:30px;height:30px;font-size:15px}#as{right:44px}#hb{right:82px;top:62px;width:30px;height:30px}#jb{bottom:96px;width:38px;height:38px}#fy{right:56px;bottom:96px;width:38px;height:38px}#fs{right:6px}}

<body>
<canvas id="game"></canvas>
