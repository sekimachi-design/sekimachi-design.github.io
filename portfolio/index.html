<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ポートフォリオ(パスワード) — Sekimachi Design Studio</title>
  <meta name="description" content="Sekimachi Design Studio のポートフォリオは、パスワード制で公開しています。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!--
    【パスワードの変えかた】(ビルド不要)
    1. https://sekimachi-design.com を開き、ブラウザのコンソール(開発者ツール)に下のコードを貼って実行する
    2. 新しいパスワードを入力すると、salt / iter / hash の1行が表示される
    3. その1行で、下の <script> の中の PW = { ... } を置き換えて、公開(push)する

    (async()=>{const pw=prompt('新しいパスワード');const salt=crypto.getRandomValues(new Uint8Array(16));
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},k,256);
    const hex=a=>[...new Uint8Array(a)].map(x=>x.toString(16).padStart(2,'0')).join('');
    console.log(`salt:'${hex(salt)}', iter:210000, hash:'${hex(b)}'`)})()

    ※これは本物のセキュリティではありません。気軽な閲覧を止めるための仕組みです。
  -->
  <style>
    :root{
      --bg:#fafafa;
      --bg-card:#ffffff;
      --text:#111111;
      --text-dim:#5c5c61;
      --border:#e5e5e5;
      --lime:#e4f550;
      --radius:16px;
      --font:'DM Sans','Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.85;min-height:100vh;display:flex;flex-direction:column}
    a{color:inherit}
    :focus-visible{outline:3px solid var(--text);outline-offset:3px;border-radius:4px}
    .skip{position:absolute;left:-9999px;top:0;background:var(--text);color:#fff;padding:12px 16px;z-index:10}
    .skip:focus{left:12px;top:12px}
    header{border-bottom:1px solid var(--border)}
    header .inner{max-width:1100px;margin:0 auto;padding:0 32px;min-height:76px;display:flex;align-items:center}
    .nav-logo{display:inline-flex;align-items:center;min-height:44px}
    .nav-logo img{height:50px;width:auto}
    main{flex:1;display:flex;align-items:center;padding:64px 32px 88px}
    .wrap{max-width:640px;width:100%;margin:0 auto}
    .section-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border:1px solid var(--border);border-radius:50px;font-size:.75rem;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:24px;background:var(--bg-card)}
    .section-tag::before{content:"";width:9px;height:9px;background:var(--lime);border:1px solid var(--text)}
    h1{font-weight:900;font-size:clamp(1.7rem,6vw,2.9rem);line-height:1.3;letter-spacing:-.02em;margin-bottom:20px}
    h1{text-wrap:balance}
    p,li{text-wrap:pretty}
    mark{background:linear-gradient(transparent 58%,var(--lime) 58%);color:inherit;padding:0 .08em}
    .lead{color:var(--text-dim);max-width:34em;margin-bottom:36px}
    form{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px}
    label{display:block;font-weight:700;font-size:.95rem;margin-bottom:10px}
    .row{display:flex;gap:12px}
    input[type=password]{flex:1;min-width:0;min-height:52px;padding:0 20px;font:inherit;font-size:1rem;border:1.5px solid #767676;border-radius:50px;background:#fff;color:var(--text)}
    button{min-height:52px;padding:0 32px;font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;background:var(--text);color:#fff;border:1px solid var(--text);border-radius:50px;transition:background .25s,color .25s}
    button:hover{background:var(--lime);color:var(--text)}
    button[disabled]{opacity:.6;cursor:progress}
    .error{min-height:1.8em;margin-top:14px;color:#a12626;font-weight:500;font-size:.95rem}
    .help{margin-top:28px;color:var(--text-dim);font-size:.95rem;max-width:34em}
    .help a{font-weight:700;text-underline-offset:4px}
    .back{display:inline-flex;align-items:center;min-height:44px;margin-top:16px;font-size:.95rem;color:var(--text-dim)}
    @media (max-width:520px){header .inner{padding:0 20px;min-height:64px}.nav-logo img{height:42px}main{padding:40px 20px 64px}.row{flex-direction:column}button{width:100%}form{padding:22px}}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <a class="skip" href="#main">本文へ移動</a>
  <header><div class="inner"><a class="nav-logo" href="/"><img src="/images/logo.png" width="202" height="50" alt="Sekimachi Design Studio(トップへ)"></a></div></header>
  <main id="main">
    <div class="wrap">
      <p class="section-tag">Portfolio</p>
      <h1>ポートフォリオは、<br><mark>パスワード制</mark>です。</h1>
      <p class="lead">これまでの実績と、制作の考え方をまとめています。ご相談いただいた方に、パスワードをお伝えしています。</p>

      <form id="gate" novalidate>
        <label for="pw">パスワード</label>
        <div class="row">
          <input id="pw" name="password" type="password" autocomplete="current-password" required aria-describedby="err">
          <button id="go" type="submit">ひらく</button>
        </div>
        <p id="err" class="error" role="alert"></p>
      </form>

      <p class="help">パスワードをお持ちでない方は、<a href="https://www.lancers.jp/profile/sekimachi_design_studio" rel="noopener">ランサーズのプロフィール</a>から、お気軽にご連絡ください。</p>
      <a class="back" href="/">← トップへ戻る</a>
    </div>
  </main>

  <script>
  (function(){
    // ハッシュだけを置いている(パスワード本体は書かない)。変えかたは、上のコメントを参照。
    var PW = { salt:'670f0c6a339eafb1eab026adf609a43a', iter:210000, hash:'731c82a83dcf8c6761552d2088a2934e74232cfafb5a8fb2cf42c097f23d6ef5' };
    var NEXT = 'main.html';
    var KEY = 'sd_pf';

    try { if (sessionStorage.getItem(KEY) === '1') { location.replace(NEXT); return; } } catch (e) {}

    var form = document.getElementById('gate');
    var input = document.getElementById('pw');
    var btn = document.getElementById('go');
    var err = document.getElementById('err');

    function hexToBytes(h){ var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
    function bytesToHex(b){ return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); }

    async function check(pw){
      var key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
      var bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:hexToBytes(PW.salt), iterations:PW.iter, hash:'SHA-256' }, key, 256);
      return bytesToHex(bits) === PW.hash;
    }

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      err.textContent = '';
      if (!input.value) { err.textContent = 'パスワードを入力してください。'; input.focus(); return; }
      if (!window.crypto || !crypto.subtle) { err.textContent = 'このページは、https:// のアドレスで開いてください。'; return; }
      btn.disabled = true;
      try {
        if (await check(input.value)) {
          try { sessionStorage.setItem(KEY, '1'); } catch (e2) {}
          location.href = NEXT;
          return;
        }
        err.textContent = 'パスワードが違います。もう一度ご確認ください。';
        input.select();
      } catch (e3) {
        err.textContent = '確認できませんでした。時間をおいて、もう一度お試しください。';
      }
      btn.disabled = false;
      input.focus();
    });
  })();
  </script>
</body>
</html>
